name: doc_ci 
on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mike mkdocstrings[python] pymdown-extensions mkdocs-glightbox mkdocs-static-i18n
      # --no-deps: mkdocstrings reads the source statically (griffe), so the docs
      # build never imports insarhub at runtime and doesn't need the heavy geo
      # stack. Installing deps would pull the `gdal` PyPI package, which builds
      # from source and fails on the runner (no native gdal-config).
      - run: pip install -e . --no-deps
      - run: git fetch origin gh-pages --depth=1 || true
      - run: |
           VERSION=${GITHUB_REF##*/}
           if  [[ $GITHUB_REF == refs/tags/* ]]; then
            mike deploy --push --update-aliases $VERSION latest
            mike set-default $VERSION --push
           else
            mike deploy --push dev
           fi
              