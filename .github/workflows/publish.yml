name: Build, Test & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # ── 1. Build wheel (Linux only — pure Python, works on all platforms) ─────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/insarhub/app/frontend/package-lock.json

      - name: Build React frontend
        working-directory: src/insarhub/app/frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 2. Test install on all platforms ─────────────────────────────────────
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}   # required for conda to activate correctly
    steps:
      - name: Set up conda with Python ${{ matrix.python }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python }}
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: test-env
          auto-activate-base: false

      - name: Ensure pip in conda env
        run: conda install -y pip

      - name: Install conda dependencies
        run: conda install -y gdal pysolid pygrib cvxopt
        continue-on-error: true

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test — import
        run: python -c "import insarhub; print('version:', insarhub.__version__)"

      - name: Smoke test — insarhub-app --version
        run: insarhub-app --version

      # Run the unit test suite against the INSTALLED wheel (not the src tree),
      # so a real logic regression -- config drift, layout discovery, the
      # concurrency helpers -- fails CI instead of only a smoke import.
      # dev_test.py is an exploratory scratch script (needs xarray), excluded.
      - name: Check out source (for the test/ directory)
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run unit tests
        run: python -m pip show insarhub >/dev/null && cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/test" --ignore="$GITHUB_WORKSPACE/test/dev_test.py" -q
        shell: bash -el {0}

