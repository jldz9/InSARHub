{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
{% endblock %} 

{% block header %}
  {{ super() }}
  <script>
    (function () {
      // Resolved once, on the initial full page load, so instant navigation
      // cannot leave a stale relative path behind in the persistent header.
      var QR_URL = new URL("{{ 'img/wechat-qr.png' | url }}", document.baseURI).href;

      var DISCORD_PATH = '<path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>';

      // Font Awesome brands/weixin
      var WECHAT_PATH = '<path d="M385.2 167.6c6.4 0 12.6.3 18.8 1.1C387.4 90.3 303.3 32 207.7 32 100.5 32 13 104.8 13 197.4c0 53.4 29.3 97.5 77.9 131.6l-19.3 58.6 68-34.1c24.4 4.8 43.8 9.7 68.2 9.7 6.2 0 12.1-.3 18.3-.8-4-12.9-6.2-26.6-6.2-40.8-.1-84.9 72.9-154 165.3-154m-104.5-52.9c14.5 0 24.2 9.7 24.2 24.4 0 14.5-9.7 24.2-24.2 24.2-14.8 0-29.3-9.7-29.3-24.2.1-14.7 14.6-24.4 29.3-24.4m-136.4 48.6c-14.5 0-29.3-9.7-29.3-24.2 0-14.8 14.8-24.4 29.3-24.4 14.8 0 24.4 9.7 24.4 24.4 0 14.6-9.6 24.2-24.4 24.2M563 319.4c0-77.9-77.9-141.3-165.4-141.3-92.7 0-165.4 63.4-165.4 141.3S305 460.7 397.6 460.7c19.3 0 38.9-5.1 58.6-9.9l53.4 29.3-14.8-48.6C534 402.1 563 363.2 563 319.4m-219.1-24.5c-9.7 0-19.3-9.7-19.3-19.6 0-9.7 9.7-19.3 19.3-19.3 14.8 0 24.4 9.7 24.4 19.3 0 10-9.7 19.6-24.4 19.6m107.1 0c-9.7 0-19.3-9.7-19.3-19.6 0-9.7 9.7-19.3 19.3-19.3 14.5 0 24.4 9.7 24.4 19.3.1 10-9.9 19.6-24.4 19.6"/>';

      var EMAIL_PATH = '<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>';

      function isChinese() {
        var lang = (document.documentElement.lang || "").toLowerCase();
        return lang === "zh" || lang.indexOf("zh-") === 0;
      }

      function svg(viewBox, body) {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + viewBox +
               '" style="width:1.2rem;height:1.2rem;fill:currentColor;">' + body + '</svg>';
      }

      function makeIcon(href, title, viewBox, body, newTab) {
        var a = document.createElement("a");
        a.href = href;
        a.title = title;
        if (newTab) { a.target = "_blank"; a.rel = "noopener"; }
        a.className = "md-header__button md-icon ih-injected";
        a.innerHTML = svg(viewBox, body);
        return a;
      }

      // WeChat has no link to follow, so the icon carries a QR code that opens
      // on hover (and on tap, which is all touch devices can offer).
      function makeWeChat(linkClass, extraClass) {
        var wrap = document.createElement("span");
        wrap.className = "ih-wechat ih-injected" + (extraClass ? " " + extraClass : "");

        var a = document.createElement("a");
        a.href = QR_URL;
        a.target = "_blank";
        a.rel = "noopener";
        a.title = "微信";
        a.className = linkClass + " ih-wechat__icon";
        a.innerHTML = svg("0 0 576 512", WECHAT_PATH);

        var panel = document.createElement("span");
        panel.className = "ih-wechat__qr";
        panel.innerHTML = '<img src="' + QR_URL + '" alt="微信二维码"><span class="ih-wechat__caption">微信扫码联系</span>';

        wrap.appendChild(a);
        wrap.appendChild(panel);
        return wrap;
      }

      function renderHeader() {
        var option = document.querySelector(".md-header__option");
        if (!option) return;

        // The header survives instant navigation, so clear a previous pass
        // before re-rendering for the language of the current page.
        option.querySelectorAll(".ih-injected").forEach(function (el) { el.remove(); });

        var chat = isChinese()
          ? makeWeChat("md-header__button md-icon", "ih-wechat--header")
          : makeIcon("https://discord.gg/RJJM42MBUU", "Discord", "0 0 24 24", DISCORD_PATH, true);

        var email = makeIcon("mailto:jiaweiliwork@outlook.com", "Email", "0 0 24 24", EMAIL_PATH, false);

        // Insert in reverse order so final left→right is: email | chat | [color toggle]
        option.insertBefore(chat, option.firstChild);
        option.insertBefore(email, chat);
      }

      function renderFooter() {
        if (!isChinese()) return;
        var discord = document.querySelector('.md-social__link[href*="discord"]');
        if (!discord) return;
        discord.replaceWith(makeWeChat("md-social__link", "ih-wechat--footer"));
      }

      function render() {
        renderHeader();
        renderFooter();
      }

      document.addEventListener("DOMContentLoaded", function () {
        // document$ re-emits on every instant navigation; the footer is rebuilt
        // each time, so patching it once would not survive.
        if (typeof document$ !== "undefined" && document$.subscribe) {
          document$.subscribe(render);
        } else {
          render();
        }
      });
    })();
  </script>
{% endblock %}

{% block footer %}
  {{ super() }}
{% endblock %}
