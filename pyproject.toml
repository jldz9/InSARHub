[build-system]
requires = ['setuptools>=61.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = "insarhub"
dynamic= ["version"]
authors = [{name="jldz9", email="Jiaweiliwork@outlook.com"}]
description = "A modular Python framework for automated InSAR and time-series processing."
readme = 'README.md'
dependencies = [
"asf_search",
"burst2safe",
"cdsapi",
"colorama",
"contextily",
"dem_stitcher",
"hyp3_sdk",
"rasterio>=1.4",
"sentineleof",
"openpyxl",
"fastapi",
"uvicorn",
"python-multipart",
"numpy<2.0",
"psutil",
"networkx",
"mintpy",
"pyaps3",
"dask",
"h5py",
# pyaps3 (MintPy's correct_troposphere backend) still imports pkg_resources at
# runtime, which setuptools removed in v81 -- without this pin a fresh env gets
# setuptools>=81 and correct_troposphere dies with "No module named
# 'pkg_resources'". Pinning <81 keeps pkg_resources shipped. Drop once pyaps3
# stops importing it.
"setuptools<81",
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
    "httpx",            # FastAPI TestClient transport
]

[project.scripts]
insarhub = "insarhub.cli.main:main"
insarhub-app = "insarhub.app.main:main"

[project.urls]
homepage = "https://jldz9.github.io/InSARHub"
repository = "https://github.com/jldz9/InSARHub"

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
"insarhub.app" = ["frontend/dist/**/*", "frontend/dist/index.html"]

[tool.setuptools.dynamic]
version = {attr = "insarhub._version.__version__"}


[tool.pytest.ini_options]
testpaths = ["test"]
# Tier 3 drives real backends and real data; it is opt-in via `-m e2e` so that a
# bare `pytest` stays fast and hermetic. Everything else runs by default.
addopts = "-m 'not e2e'"
markers = [
    "install: tier 1 -- the installed environment is wired up correctly",
    "basic: tier 2 -- imports, CLI and GUI contracts, no real data",
    "e2e: tier 3 -- full workflow against real (minimal) data; needs backends",
    "regression: tier 4 -- one case per previously-fixed bug",
    "needs_isce2: requires a working ISCE2 install",
    "needs_isce3: requires ISCE3 + COMPASS + dolphin",
    "needs_gmtsar: requires a GMTSAR install",
    "needs_mintpy: requires MintPy",
    "needs_network: performs real network calls",
    "needs_creds: requires Earthdata/CDSE/CDS credentials",
]
